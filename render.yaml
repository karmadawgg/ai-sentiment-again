services:
  - type: web
    name: feedback-sentiment-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: feedback-sentiment-db
          property: connectionString

databases:
  - name: feedback-sentiment-db
    plan: free
